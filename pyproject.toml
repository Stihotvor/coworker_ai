[tool.poetry]
name = "coworker-ai"
version = "0.1.0"
description = "Helpful AI assistant for my daily routines"
authors = ["Yevhen Dyachenko"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "src", from = "."}
]

[tool.poetry.dependencies]
python = "^3.12"
redis = "^5.0.6"
gradio = "^6.26.0"
llama-index-vector-stores-chroma = "^0.6.0"
llama-index = "^0.14.24"
llama-index-llms-lmstudio = "^0.6.0"
fastapi = "^0.141.1"
chromadb = "^1.5.9"
llama-index-storage-kvstore-redis = "^0.5.1"
llama-index-retrievers-bm25 = "^0.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
hypothesis = "^6.100.0"
factory-boy = "^3.3.0"
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.10.0"
bandit = "^1.7.8"
pre-commit = "^3.7.0"
types-redis = "^4.3.0"
types-requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Add scripts
[tool.poetry.scripts]
gradio_server = "src.ui.entrypoints.gradio_command:app"
uvicorn_server = "src.ui.entrypoints.mounted_command:app"

# Add pytest configuration
[tool.pytest.ini_options]
addopts = "-v --cov=src --cov-report=term-missing"
testpaths = ["tests"]
markers = [
    "unit: mark a test as a unit test",
    "integration: mark a test as an integration test",
    "slow: mark a test as slow (takes > 1 second)"
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py312']

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "tests"]

# mypy configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
ignore_missing_imports = true