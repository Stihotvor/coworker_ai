name: Quality Gateway

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run Black formatting check
        run: poetry run black --check src/ tests/

      - name: Run isort import sorting check
        run: poetry run isort --check-only src/ tests/

      - name: Run Flake8 linting
        run: poetry run flake8 src/ tests/

      - name: Run mypy type checking
        run: poetry run mypy src/ tests/

      - name: Run Bandit security scan
        run: poetry run bandit -r src/ -ll -ii

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev --no-interaction --no-ansi

      - name: Run unit tests with coverage
        run: poetry run pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term --cov-fail-under=80

      - name: Run integration tests
        run: poetry run pytest tests/integration/ -v --cov=src --cov-report=term --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if all jobs passed
        run: |
          echo "Lint job: ${{ needs.lint.result }}"
          echo "Test job: ${{ needs.test.result }}"
          
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Quality Gateway Failed!"
            echo "Please fix the following issues:"
            if [ "${{ needs.lint.result }}" != "success" ]; then
              echo "  - Linting/Formatting issues"
            fi
            if [ "${{ needs.test.result }}" != "success" ]; then
              echo "  - Test failures or coverage below 80%"
            fi
            exit 1
          fi

  # Optional: Mutation testing (can be added later)
