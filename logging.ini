[loggers]
keys=root,apiLogger,uiLogger,storageLogger

[handlers]
keys=consoleHandler

[formatters]
keys=appFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_apiLogger]
level=DEBUG
handlers=consoleHandler
qualname=apiLogger
propagate=0

[logger_uiLogger]
level=DEBUG
handlers=consoleHandler
qualname=uiLogger
propagate=0

[logger_storageLogger]
level=DEBUG
handlers=consoleHandler
qualname=storageLogger
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=appFormatter
args=(sys.stdout,)

[formatter_appFormatter]
format=%(levelname)s:   %(asctime)s [%(name)s] %(message)s
datefmt=%d-%m-%Y %H:%M:%S