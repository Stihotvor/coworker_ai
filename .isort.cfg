[settings]
profile = black
line_length = 88
known_first_party = src,tests
known_third_party = 
    chromadb,
    fastapi,
    gradio,
    llama_index,
    openai,
    pytest,
    redis,
    requests
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
